---
- name: Create bootstrap token on first control plane
  shell: kubeadm token create --ttl 1h
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: join_token

- name: Generate certificate key and upload control plane certificates
  shell: |
    KEY=$(kubeadm certs certificate-key)
    kubeadm init phase upload-certs --upload-certs --certificate-key "$KEY"
    echo "$KEY"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: certificate_key_raw

- name: Compute CA cert hash for discovery
  shell: openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt | openssl rsa -pubin -outform der 2>/dev/null | openssl dgst -sha256 -hex | sed 's/^.* //'
  register: ca_hash
